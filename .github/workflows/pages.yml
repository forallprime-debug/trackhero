name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Stage static game
        run: |
          mkdir _site
          cp index.html style.css screens.css battle.css status-bars.css combat.js boss-art.js ui-kit.html ui-kit.css ui-kit.js game.js screens.js bosses.js rhythm.js audio.js charts*.json _site/
          cp -r assets Music _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
