<!doctype html><html lang="ru"><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Локальная проверка экранов Dark Sounds</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../screens.css"><style>body{display:flex;flex-direction:column;align-items:center;background:#202020}nav{padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}nav button{font:12px system-ui;background:#333;border:1px solid #777;padding:8px}#game{width:100%;max-width:500px;height:calc(100dvh - 48px);flex:none}</style><nav id="preview-nav"><button id="death">Поражение</button></nav><main id="game" data-screen="result"><button id="outcome" class="menu-screen outcome"><div class="defeat-backdrop" aria-hidden="true"><img class="death-art" src="../assets/figma/defeat-imgImage122.png" alt=""><div class="death-shade"></div></div><div class="defeat-glow" aria-hidden="true"></div><div class="screen-stage result-stage"><div class="brand"><img src="../assets/DARKS%20SOUNDS.svg" alt="Dark Sounds"></div><div id="result-art"></div><div class="result-copy"><h2 id="result-title"></h2><p id="result-description"></p></div><img class="death-line" src="../assets/figma/defeat-imgVector22.svg" alt=""><div class="result-stats"><div><strong id="result-score"></strong><span>Души</span></div><div><strong id="result-accuracy"></strong><span>Попадания</span></div><div><strong id="result-combo"></strong><span>Макс. комбо</span></div></div></div></button></main><script type="module">
import {BOSSES,outcome} from '../bosses.js';import{paintOutcome,fitScreens}from'../screens.js';
// Shared screen renderer, fixed data; this preview never changes a real fight.
function show(mode,boss){paintOutcome(outcome(mode,boss,{score:35986,hits:92,total:100,combo:117}));for(const img of document.querySelectorAll('#result-art img'))img.src='../'+img.getAttribute('src')}
document.getElementById('preview-nav').insertAdjacentHTML('afterbegin',BOSSES.map((boss,i)=>`<button data-boss="${i}">${boss.name} · победа</button>`).join(''));
document.querySelectorAll('[data-boss]').forEach(b=>b.onclick=()=>show('win',BOSSES[+b.dataset.boss]));document.getElementById('death').onclick=()=>show('dead',BOSSES[0]);fitScreens(document.getElementById('game'));show('win',BOSSES[0]);
</script></html>
