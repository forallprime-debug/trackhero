<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Локальная проверка экранов Dark Sounds</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../screens.css"><style>body{display:flex;flex-direction:column;align-items:center;background:#202020}nav{padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}nav button{font:12px system-ui;background:#333;border:1px solid #777;padding:8px}#game{width:360px;height:780px;flex:none}</style><nav><button data-boss="0">Анна · победа</button><button data-boss="1">Егор · победа</button><button id="death">Поражение</button></nav><main id="game" data-screen="result"><button id="outcome" class="menu-screen outcome"><div class="screen-stage result-stage"><div class="brand">DARK SOUNDS<img src="../assets/figma/victory-anna-imgVector1.svg" alt=""></div><div id="result-art"></div><div class="death-shade"></div><div class="result-copy"><h2 id="result-title"></h2><p id="result-description"></p></div><img class="death-line" src="../assets/figma/defeat-imgVector22.svg" alt=""><div class="result-stats"><div><strong id="result-score"></strong><span>Души</span></div><div><strong id="result-accuracy"></strong><span>Попадания</span></div><div><strong id="result-combo"></strong><span>Макс. комбо</span></div></div></div></button></main><script type="module">
import {BOSSES,outcome} from '../bosses.js';import{paintOutcome,fitScreens}from'../screens.js';
// Shared screen renderer, fixed data; this preview never changes a real fight.
function show(mode,boss){paintOutcome(outcome(mode,boss,{score:35986,hits:92,total:100,combo:117}));for(const img of document.querySelectorAll('#result-art img'))img.src='../'+img.getAttribute('src')}
document.querySelectorAll('[data-boss]').forEach(b=>b.onclick=()=>show('win',BOSSES[+b.dataset.boss]));document.getElementById('death').onclick=()=>show('dead',BOSSES[0]);fitScreens(document.getElementById('game'));show('win',BOSSES[0]);
</script></html>
